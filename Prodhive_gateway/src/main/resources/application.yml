server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: core-service
          uri: ${CORE_SERVICE_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/core/**

        - id: auth-service-legacy
          uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/{*segment}
          filters:
            - SetPath=/api/{segment}

        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/**

        - id: core-service-ws
          uri: ${CORE_SERVICE_WS_URI:ws://127.0.0.1:8082}
          predicates:
            - Path=/ws/**

jwt:
  secret: ${JWT_SECRET:prodhive_secret_key_for_jwt_token_auth_service_32bytes}
