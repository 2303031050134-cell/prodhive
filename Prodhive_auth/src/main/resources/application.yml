server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:authdb}?options=-c%20timezone=UTC}

    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}



  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET:prodhive_secret_key_for_jwt_token_auth_service_32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
