server:
  port: ${PORT:8082}

spring:
  application:
    name: core-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:${GITHUB_APP_WEBHOOK_SECRET:}}
  app:
    id: ${GITHUB_APP_ID}
    slug: ${GITHUB_APP_SLUG}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
    webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET}
    setup-redirect: ${GITHUB_APP_SETUP_REDIRECT}

openrouter:
  api:
    key: ${OPENROUTER_API_KEY}