server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: core-service
  datasource:
    url: ${DB_URL}

    username: ${DB_USER}
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}
  app:
    id: ${GITHUB_APP_ID}
    slug: ${GITHUB_APP_SLUG:prodhive}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
    webhook-secret: ${GITHUB_APP_WEBHOOK_SECRET}
    setup-redirect: ${GITHUB_APP_SETUP_REDIRECT}

openrouter:
  api:
    key: ${OPENROUTER_API_KEY}
